openapi: 3.0.3
info:
  title: Supay API v1
  version: 1.0.0
  description: |
    Contrato público estable de Supay (multi-tenant, SIAT Bolivia).
    Flujo beta día 1: bootstrap tenant -> sucursal -> punto de venta ->
    setup (CUIS + catálogos + CUFD) -> preview -> emit -> get/xml/pdf ->
    siat-status -> annul. Auth: `X-API-Key` por tenant.
    `POST /internal/companies` usa `X-Backend-Token` (BACKEND_SECRET).
    Fuente de verdad para docs + SDK TypeScript `Supay`.
    Ver backend/docs/api-v1.md y docs/API_SPEC.md.
servers:
  - url: http://localhost:8081
    description: Local / piloto
security:
  - ApiKeyAuth: []
tags:
  - name: system
  - name: bootstrap
  - name: auth
  - name: branches
  - name: pos
  - name: certificates
  - name: apikeys
  - name: siat
  - name: catalogs
  - name: invoices
paths:
  /v1/health:
    get:
      summary: Smoke test
      operationId: healthCheck
      security: []
      tags: [system]
      x-fern-sdk-group-name: system
      x-fern-sdk-method-name: healthCheck
      responses:
        "200":
          description: API en ejecución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/internal/companies:
    post:
      summary: Bootstrap tenant (crea empresa + API key)
      operationId: bootstrapCompany
      security:
        - BackendToken: []
      tags: [bootstrap]
      x-fern-sdk-group-name: bootstrap
      x-fern-sdk-method-name: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapCompanyRequest"
      responses:
        "201":
          description: Empresa creada con su X-API-Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapCompanyResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/signup:
    post:
      summary: Registrar usuario
      operationId: signup
      security: []
      tags: [auth]
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/auth/login:
    post:
      summary: Iniciar sesión
      operationId: login
      security: []
      tags: [auth]
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/me:
    get:
      summary: Usuario autenticado
      operationId: getMe
      tags: [auth]
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: getMe
      responses:
        "200":
          description: Usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v1/auth/companies:
    get:
      summary: Empresas del usuario y su rol
      operationId: listMyCompanies
      tags: [auth]
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: listMyCompanies
      responses:
        "200":
          description: Empresas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
    post:
      summary: Crear empresa (quedas owner)
      operationId: createMyCompany
      tags: [auth]
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: createMyCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapCompanyRequest"
      responses:
        "201":
          description: Empresa creada (sin api_key; créala en /companies/{id}/api-keys).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /v1/branches/:
    post:
      summary: Crear sucursal
      operationId: createBranch
      tags: [branches]
      x-fern-sdk-group-name: branches
      x-fern-sdk-method-name: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: Sucursal creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: Listar sucursales
      operationId: listBranches
      tags: [branches]
      x-fern-sdk-group-name: branches
      x-fern-sdk-method-name: list
      parameters:
        - name: company_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lista no paginada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/branches/{id}:
    get:
      summary: Obtener sucursal
      operationId: getBranch
      tags: [branches]
      x-fern-sdk-group-name: branches
      x-fern-sdk-method-name: get
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sucursal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar sucursal
      operationId: updateBranch
      tags: [branches]
      x-fern-sdk-group-name: branches
      x-fern-sdk-method-name: update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchRequest"
      responses:
        "200":
          description: Sucursal actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    delete:
      summary: Eliminar sucursal
      operationId: deleteBranch
      tags: [branches]
      x-fern-sdk-group-name: branches
      x-fern-sdk-method-name: delete
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Eliminada. }
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/point-of-sales/:
    post:
      summary: Registrar punto de venta
      operationId: createPointOfSale
      tags: [pos]
      x-fern-sdk-group-name: pointOfSales
      x-fern-sdk-method-name: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePosRequest"
      responses:
        "201":
          description: POS creado (codigo_punto_venta auto si se omite).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSale"
        "400":
          $ref: "#/components/responses/ValidationError"
    get:
      summary: Listar puntos de venta
      operationId: listPointOfSales
      tags: [pos]
      x-fern-sdk-group-name: pointOfSales
      x-fern-sdk-method-name: list
      parameters:
        - name: company_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lista no paginada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSaleList"
  /v1/point-of-sales/{id}:
    get:
      summary: Obtener punto de venta
      operationId: getPointOfSale
      tags: [pos]
      x-fern-sdk-group-name: pointOfSales
      x-fern-sdk-method-name: get
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: POS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSale"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Actualizar punto de venta
      operationId: updatePointOfSale
      tags: [pos]
      x-fern-sdk-group-name: pointOfSales
      x-fern-sdk-method-name: update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePosRequest"
      responses:
        "200":
          description: POS actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSale"
  /v1/companies/{id}/certificates/:
    post:
      summary: Subir certificado P12
      operationId: uploadCertificate
      tags: [certificates]
      x-fern-sdk-group-name: certificates
      x-fern-sdk-method-name: upload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [p12_file]
              properties:
                p12_file: { type: string, format: binary, description: Archivo .p12/.pfx (máx 5 MB). }
                p12_password: { type: string }
                name: { type: string }
                type: { type: string, default: P12 }
      responses:
        "201":
          description: Certificado activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "400":
          $ref: "#/components/responses/ValidationError"
    get:
      summary: Listar certificados
      operationId: listCertificates
      tags: [certificates]
      x-fern-sdk-group-name: certificates
      x-fern-sdk-method-name: list
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Certificados (sin password/hash).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
  /v1/companies/{id}/certificates/active:
    get:
      summary: Certificado activo
      operationId: getActiveCertificate
      tags: [certificates]
      x-fern-sdk-group-name: certificates
      x-fern-sdk-method-name: getActive
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Certificado activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
  /v1/companies/{id}/api-keys/:
    post:
      summary: Crear API key (solo se muestra una vez)
      operationId: createApiKey
      tags: [apikeys]
      x-fern-sdk-group-name: apiKeys
      x-fern-sdk-method-name: create
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
    get:
      summary: Listar API keys (solo prefijos)
      operationId: listApiKeys
      tags: [apikeys]
      x-fern-sdk-group-name: apiKeys
      x-fern-sdk-method-name: list
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
  /v1/setup:
    post:
      summary: Setup idempotente (CUIS + catálogos + CUFD + readiness)
      operationId: setupPointOfSale
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: CUIS/CUFD vigentes + readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/siat/cuis/{pointOfSaleId}:
    post:
      summary: Solicitar CUIS (fuerza renovación)
      operationId: requestCuis
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: requestCuis
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: CUIS vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuisResult"
        "503":
          $ref: "#/components/responses/SiatUnavailable"
  /v1/siat/cufd/{pointOfSaleId}:
    post:
      summary: Solicitar CUFD (requiere CUIS)
      operationId: requestCufd
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: requestCufd
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: CUFD vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CufdResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/siat/sincronizar/{pointOfSaleId}:
    post:
      summary: Sincronizar catálogos SIAT
      operationId: syncCatalogs
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: syncCatalogs
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
        - name: operation
          in: query
          required: false
          schema: { type: string }
          description: Si se omite sincroniza todo; si no solo esa operación.
      responses:
        "200":
          description: Resumen por operación (SUCCESS/FAILED/EMPTY).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSummary"
        "403":
          description: Fallo single-operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncSummary"
  /v1/siat/evento-significativo/{pointOfSaleId}:
    post:
      summary: Registrar evento significativo (contingencia)
      operationId: registerSignificantEvent
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: registerSignificantEvent
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignificantEventRequest"
      responses:
        "200":
          description: Evento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignificantEventResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/siat/paquete/{pointOfSaleId}:
    post:
      summary: Enviar paquete offline (contingencia)
      operationId: sendPackage
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: sendPackage
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageRequest"
      responses:
        "200":
          description: Paquete enviado.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/siat/paquete/{batchId}/validate:
    post:
      summary: Validar lote antes de enviar
      operationId: validatePackage
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: validatePackage
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resultado de validación.
          content:
            application/json:
              schema: { type: object }
  /v1/siat/masiva/{companyId}/{pointOfSaleId}:
    post:
      summary: Emisión masiva (única vía sector 30)
      operationId: sendBulk
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: sendBulk
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Lote masivo enviado.
          content:
            application/json:
              schema: { type: object }
        "400":
          $ref: "#/components/responses/ValidationError"
  /v1/siat/firma/{pointOfSaleId}:
    post:
      summary: Firmar un XML con el certificado del POS
      operationId: signInvoiceXml
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: signXml
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignXmlRequest"
      responses:
        "200":
          description: XML firmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignXmlResult"
  /v1/siat/compras/{pointOfSaleId}:
    post:
      summary: Enviar compras (recepción de compras SIAT)
      operationId: sendPurchases
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: sendPurchases
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasesRequest"
      responses:
        "200":
          description: Compras enviadas.
          content:
            application/json:
              schema: { type: object }
  /v1/siat/masiva/{batchId}/validate:
    post:
      summary: Validar lote masivo antes de enviar
      operationId: validateBulk
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: validateBulk
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resultado de validación.
          content:
            application/json:
              schema: { type: object }
  /v1/siat/documento-ajuste/{pointOfSaleId}:
    post:
      summary: Documento de ajuste (deprecado, usar notas por invoices)
      operationId: sendAdjustmentDocument
      deprecated: true
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: sendAdjustmentDocument
      parameters:
        - { name: pointOfSaleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Documento enviado.
          content:
            application/json:
              schema: { type: object }
  /v1/siat/catalogs:
    get:
      summary: Catálogos SIAT crudos sincronizados (tenant)
      operationId: listSiatCatalogs
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: listCatalogs
      responses:
        "200":
          description: Catálogos.
          content:
            application/json:
              schema: { type: object }
  /v1/siat/catalogs/{tipo}:
    get:
      summary: Catálogo SIAT crudo por tipo
      operationId: getSiatCatalog
      tags: [siat]
      x-fern-sdk-group-name: siat
      x-fern-sdk-method-name: getCatalog
      parameters:
        - { name: tipo, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Catálogo.
          content:
            application/json:
              schema: { type: object }
  /v1/companies/{id}/catalogs/readiness:
    get:
      summary: Readiness de catálogos (<24h críticos)
      operationId: getCatalogReadiness
      tags: [catalogs]
      x-fern-sdk-group-name: catalogs
      x-fern-sdk-method-name: getReadiness
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: point_of_sale_id, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReadiness"
  /v1/companies/{id}/catalogs/productos-sin:
    get:
      summary: Productos SIN
      operationId: listProductosSin
      tags: [catalogs]
      x-fern-sdk-group-name: catalogs
      x-fern-sdk-method-name: listProductosSin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: codigo_actividad, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Productos SIN.
          content:
            application/json:
              schema: { type: object }
  /v1/companies/{id}/catalogs/emision-bootstrap:
    get:
      summary: Bootstrap combinado para emisión
      operationId: getEmisionBootstrap
      tags: [catalogs]
      x-fern-sdk-group-name: catalogs
      x-fern-sdk-method-name: getEmisionBootstrap
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: codigo_actividad, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Bootstrap.
          content:
            application/json:
              schema: { type: object }
  /v1/invoices/preview:
    post:
      summary: Validar factura sin crear nada
      operationId: previewInvoice
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: preview
      description: Valida contrato local y catálogos. No crea cliente ni factura, no contacta al SIAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinimalInvoiceRequest"
      responses:
        "200":
          description: Vista previa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePreview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invoices:
    post:
      summary: Crear borrador
      operationId: createInvoice
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinimalInvoiceRequest"
      responses:
        "201":
          description: Borrador creado.
          headers:
            Location: { schema: { type: string }, description: "/v1/invoices/{id}" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ValidationError"
    get:
      summary: Listar facturas por POS
      operationId: listInvoices
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: list
      parameters:
        - { name: point_of_sale_id, in: query, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Lista paginada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
  /v1/invoices/emit:
    post:
      summary: Crear y emitir en el mismo request (ruta estrella)
      operationId: emitInvoice
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: emit
      description: |
        ACCEPTED/OBSERVED: respuesta SIAT. OFFLINE: timeout/caída, trae XML
        firmado + contingency_event_id. REJECTED: corregir y crear una factura nueva. Para conciliación,
        consulte la factura existente por ID y conserve su CUF. Sector 30 -> 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinimalInvoiceRequest"
      responses:
        "200":
          description: Factura emitida.
          headers:
            Location: { schema: { type: string }, description: "/v1/invoices/{id}" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/SiatRejected"
        "503":
          $ref: "#/components/responses/SiatUnavailable"
  /v1/invoices/sectores:
    get:
      summary: Catálogo de sectores y campos data
      operationId: listSectores
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: listSectores
      responses:
        "200":
          description: 51 perfiles con soportado/emision_individual/emision_masiva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorList"
  /v1/invoices/{id}:
    get:
      summary: Obtener factura por ID
      operationId: getInvoice
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: get
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: include
          in: query
          required: false
          schema: { type: string }
          description: xml,company,point_of_sale,cufd,archivo,all.
      responses:
        "200":
          description: Factura del tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/invoices/{id}/emit:
    post:
      summary: Emitir borrador existente
      operationId: emitInvoiceById
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: emitById
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Factura emitida u OFFLINE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invoices/{id}/siat-status:
    get:
      summary: Estado SIAT de la factura
      operationId: getInvoiceSiatStatus
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: getSiatStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Factura con estado SIAT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/invoices/{id}/annul:
    post:
      summary: Anular factura
      operationId: annulInvoice
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: annul
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnulRequest"
      responses:
        "200":
          description: Factura anulada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /v1/invoices/{id}/annul/revert:
    post:
      summary: Revertir anulación
      operationId: revertAnnulInvoice
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: revertAnnul
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Anulación revertida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /v1/invoices/{id}/xml:
    get:
      summary: Descargar XML firmado
      operationId: downloadInvoiceXml
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: downloadXml
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: XML firmado.
          content:
            application/xml:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sin XML (pendiente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/invoices/{id}/pdf:
    get:
      summary: Descargar PDF
      operationId: downloadInvoicePdf
      tags: [invoices]
      x-fern-sdk-group-name: invoices
      x-fern-sdk-method-name: downloadPdf
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BackendToken:
      type: apiKey
      in: header
      name: X-Backend-Token
  responses:
    ValidationError:
      description: 400 VALIDATION_ERROR.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 401 UNAUTHORIZED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 404 NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 409 CONFLICT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SiatRejected:
      description: 422 SIAT_REJECTED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SiatUnavailable:
      description: 503 SIAT_UNAVAILABLE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: ok }
        message: { type: string, example: Supay API running }
    BootstrapCompanyRequest:
      type: object
      additionalProperties: false
      required: [nit, business_name]
      properties:
        nit: { type: string }
        business_name: { type: string }
        ambiente: { type: string, enum: [PILOTO, PRODUCCION], default: PILOTO }
        modalidad: { type: integer, enum: [1, 2], default: 1 }
        usuario_siat: { type: string, default: SUPAY }
        municipio: { type: string }
        direccion: { type: string }
        telefono: { type: string }
        codigo_actividad: { type: string }
        pie_pagina: { type: string }
        certificate_webhook_url: { type: string }
        invoice_email_enabled: { type: boolean }
    BootstrapCompanyResponse:
      type: object
      properties:
        company: { type: object }
        api_key: { type: string, description: "Enviar como X-API-Key. Solo se muestra una vez." }
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required: [company_id, name]
      properties:
        company_id: { type: string, format: uuid }
        codigo_sucursal: { type: integer, default: 0 }
        name: { type: string }
        address: { type: string }
    UpdateBranchRequest:
      type: object
      properties:
        codigo_sucursal: { type: integer }
        name: { type: string }
        address: { type: string }
        active: { type: boolean }
    Branch:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        codigo_sucursal: { type: integer }
        name: { type: string }
        address: { type: string }
        active: { type: boolean }
        created_at: { type: string }
    BranchList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Branch" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CreatePosRequest:
      type: object
      additionalProperties: false
      required: [branch_id, name, description]
      properties:
        branch_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        tipo_punto_venta: { type: integer, default: 2 }
        cuis: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
    UpdatePosRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        branch_id: { type: string, format: uuid }
        tipo_punto_venta: { type: integer }
        cuis: { type: string }
        is_active: { type: boolean }
    PointOfSale:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        branch_id: { type: string }
        codigo_sucursal: { type: integer }
        codigo_punto_venta: { type: integer }
        name: { type: string }
        description: { type: string }
        tipo_punto_venta: { type: integer }
        cuis: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string }
    PointOfSaleList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PointOfSale" } }
        total: { type: integer }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [company_id, point_of_sale_id]
      properties:
        company_id: { type: string, format: uuid }
        point_of_sale_id: { type: string, format: uuid }
    SetupResult:
      type: object
      properties:
        cuis: { type: object }
        cufd: { type: object }
        operations: { type: array, items: { type: object } }
        errors: { type: array, items: { type: object } }
        readiness: { $ref: "#/components/schemas/CatalogReadiness" }
    CuisResult:
      type: object
      properties:
        success: { type: boolean }
        cuis: { type: string }
        fecha_vigencia: { type: string }
    CufdResult:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            cufd: { type: string }
            fecha_vigencia: { type: string }
            codigo_control: { type: string }
    SyncSummary:
      type: object
      properties:
        company: { type: object }
        point_of_sale: { type: object }
        operations:
          type: array
          items:
            type: object
            properties:
              operation: { type: string }
              transaccion: { type: boolean }
              codigos: { type: integer }
              status: { type: string, enum: [SUCCESS, FAILED, EMPTY] }
              rows_saved: { type: integer }
        errors: { type: array, items: { type: object } }
    CatalogReadiness:
      type: object
      properties:
        ready: { type: boolean }
        missing: { type: array, items: { type: string } }
        states: { type: array, items: { type: object } }
    AnnulRequest:
      type: object
      properties:
        codigo_motivo: { type: integer }
    SignXmlRequest:
      type: object
      additionalProperties: false
      required: [xml]
      properties:
        xml: { type: string, description: XML sin firmar. }
    SignXmlResult:
      type: object
      properties:
        success: { type: boolean }
        xml: { type: string, description: XML firmado. }
    PurchasesRequest:
      type: object
      properties:
        descripcion: { type: string }
        tipoCompra: { type: integer }
        archivo: { type: string, description: Archivo comprimido del lote de compras. }
        hashArchivo: { type: string }
        cantidadFacturas: { type: integer }
        gestion: { type: integer }
        periodo: { type: integer }
        fechaEnvio: { type: string, format: date-time }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, description: 8 a 72 caracteres. }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    SessionResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
    Company:
      type: object
      properties:
        id: { type: string }
        nit: { type: string }
        business_name: { type: string }
        ambiente: { type: string, enum: [PILOTO, PRODUCCION] }
        modalidad: { type: integer }
        municipio: { type: string }
        direccion: { type: string }
        telefono: { type: string }
        codigo_actividad: { type: string }
        pie_pagina: { type: string }
        usuario_siat: { type: string }
        certificate_webhook_url: { type: string }
        invoice_email_enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    CompanyList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Company" } }
        total: { type: integer }
    CreateApiKeyRequest:
      type: object
      properties:
        name: { type: string, default: default }
    CreateApiKeyResponse:
      type: object
      properties:
        api_key: { type: string, description: Solo se muestra una vez. Enviar como X-API-Key. }
        key_prefix: { type: string }
        id: { type: string }
        name: { type: string }
        created_at: { type: string }
    ApiKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key_prefix: { type: string }
              name: { type: string }
              is_active: { type: boolean }
              last_used_at: { type: string }
              created_at: { type: string }
    Certificate:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
        not_before: { type: string }
        not_after: { type: string }
        p12_storage_ref: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    CertificateList:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
    SignificantEventRequest:
      type: object
      properties:
        codigo_motivo_evento: { type: integer }
        descripcion: { type: string }
        cufd_evento: { type: string }
        fecha_hora_inicio_evento: { type: string }
        fecha_hora_fin_evento: { type: string }
    SignificantEventResult:
      type: object
      properties:
        success: { type: boolean }
        codigo_recepcion: { type: string }
    PackageRequest:
      type: object
      properties:
        invoice_ids:
          type: array
          items: { type: string, format: uuid }
          description: Ausente = auto (facturas OFFLINE pendientes).
    MinimalInvoiceRequest:
      type: object
      additionalProperties: false
      required: [point_of_sale_id, customer, items]
      properties:
        point_of_sale_id: { type: string, description: Punto de venta con CUIS/CUFD vigente. }
        customer: { $ref: "#/components/schemas/MinimalInvoiceCustomer" }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MinimalInvoiceItem" }
        invoice_type: { type: string, default: sale }
        sector: { type: string, default: auto }
        data: { type: object, description: "{} para sector 1." }
        layout: { type: string, description: Solo sector 24. }
        reference_invoice_id: { type: string, format: uuid, description: Solo ajustes. }
        payment: { $ref: "#/components/schemas/MinimalInvoicePayment" }
        total: { type: number, description: Solo sectores sin detalle. }
    MinimalInvoiceCustomer:
      type: object
      additionalProperties: false
      required: [document_number, name]
      properties:
        document_type: { type: string, default: CI }
        document_number: { type: string }
        complement: { type: string }
        name: { type: string }
        email: { type: string }
    MinimalInvoiceItem:
      type: object
      additionalProperties: false
      required: [sku, description, codigo_producto_sin, unidad_medida, quantity, price]
      properties:
        sku: { type: string }
        description: { type: string }
        codigo_actividad: { type: string }
        codigo_producto_sin: { type: integer, format: int64, minimum: 1 }
        unidad_medida: { type: integer, minimum: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        price: { type: number, minimum: 0 }
        discount: { type: number, minimum: 0 }
        data: { type: object }
    MinimalInvoicePayment:
      type: object
      additionalProperties: false
      required: [method_code, currency_code, exchange_rate]
      properties:
        method_code: { type: integer, minimum: 1 }
        currency_code: { type: integer, minimum: 1 }
        exchange_rate: { type: number, exclusiveMinimum: 0 }
    InvoicePreview:
      type: object
      required: [point_of_sale_id, customer, items, invoice_type, codigo_documento_sector, subtotal, total]
      properties:
        point_of_sale_id: { type: string }
        customer: { $ref: "#/components/schemas/InvoicePreviewCustomer" }
        items: { type: array, items: { $ref: "#/components/schemas/InvoicePreviewItem" } }
        invoice_type: { type: string }
        codigo_documento_sector: { type: integer }
        codigo_metodo_pago: { type: integer }
        codigo_moneda: { type: integer }
        tipo_cambio: { type: number }
        subtotal: { type: number }
        total: { type: number }
    InvoicePreviewCustomer:
      type: object
      required: [document_type, document_number, name]
      properties:
        document_type: { type: string }
        document_number: { type: string }
        name: { type: string }
        email: { type: string }
    InvoicePreviewItem:
      type: object
      required: [sku, quantity, unit_price, subtotal]
      properties:
        sku: { type: string }
        description: { type: string }
        quantity: { type: number }
        unit_price: { type: number }
        discount: { type: number }
        subtotal: { type: number }
        codigo_actividad: { type: string }
        codigo_producto_sin: { type: integer, format: int64 }
        unidad_medida: { type: integer }
        codigo_documento_sector: { type: integer }
    Invoice:
      type: object
      required: [id, company_id, point_of_sale_id, invoice_number, status, subtotal, total, customer, items]
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string }
        customer_id: { type: string }
        point_of_sale_id: { type: string }
        contingency_event_id: { type: string, description: Presente cuando status=OFFLINE. }
        invoice_number: { type: integer }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        cuf: { type: string }
        subtotal: { type: number }
        total: { type: number }
        codigo_metodo_pago: { type: integer }
        codigo_moneda: { type: integer }
        tipo_cambio: { type: number }
        codigo_documento_sector: { type: integer }
        emission_type: { type: string }
        issue_date: { type: string, format: date-time }
        siat_reception_code: { type: string }
        siat_mensajes: { type: array, items: { $ref: "#/components/schemas/SiatMensaje" } }
        customer: { $ref: "#/components/schemas/InvoiceCustomer" }
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceItem" } }
        created_at: { type: string, format: date-time }
    InvoiceList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    InvoiceStatus:
      type: string
      enum: [PENDING, SENDING, SENT, ACCEPTED, OBSERVED, OFFLINE, REJECTED, CANCELLED]
    InvoiceCustomer:
      type: object
      required: [document_type, document_number, name]
      properties:
        id: { type: string }
        name: { type: string }
        document_type: { type: string }
        document_number: { type: string }
    InvoiceItem:
      type: object
      required: [code, quantity, unit_price, subtotal]
      properties:
        id: { type: string }
        code: { type: string }
        description: { type: string }
        quantity: { type: number }
        unit_price: { type: number }
        discount: { type: number }
        subtotal: { type: number }
    SiatMensaje:
      type: object
      properties:
        codigo: { type: integer }
        descripcion: { type: string }
    SectorList:
      type: array
      items: { $ref: "#/components/schemas/SectorProfile" }
    SectorProfile:
      type: object
      properties:
        codigo: { type: integer }
        nombre: { type: string }
        estado: { type: string }
        soportado: { type: boolean }
        emision_individual: { type: boolean }
        emision_masiva: { type: boolean }
        habilitado: { type: boolean }
        campos: { type: array, items: { type: object } }
        campos_detalle: { type: array, items: { type: object } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, UNAUTHORIZED, FORBIDDEN, SIAT_REJECTED, SIAT_UNAVAILABLE, INTERNAL, RATE_LIMITED]
        message: { type: string }
