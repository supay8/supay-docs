openapi: 3.0.3
info:
  title: Supay Invoicing v1 — Una factura
  version: 1.0.0
  description: |
    CONTRATO PARCIAL: este archivo describe únicamente el flujo "una factura".
    No representa todos los endpoints de Supay. El contrato HTTP general está
    documentado en docs/api-v1.md.

    Contrato mínimo para el primer test del SDK: emitir UNA factura de
    compra-venta estándar (sector 1, `sector: "auto"`).
    Auth única: header `X-API-Key`. Fuera de alcance: borradores separados,
    anulación, emisión masiva/paquetes, ajustes (24/29/47/48), sectores 30/33/52,
    CUIS/CUFD/sincronización manuales y CRUD auxiliar.
    Fuente: docs/sdk-facturacion-una-factura.md
servers:
  - url: http://localhost:8081
    description: Local / piloto
security:
  - ApiKeyAuth: []
paths:
  /v1/health:
    get:
      summary: Smoke test
      operationId: healthCheck
      security: []
      tags:
        - system
      responses:
        "200":
          description: API en ejecución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/invoices/emit:
    post:
      summary: Crear y emitir factura en el mismo request
      operationId: emitInvoice
      tags:
        - invoices
      description: |
        Ruta estrella del SDK. Crea el borrador e intenta emitirlo al SIAT.
        `ACCEPTED`/`OBSERVED`: respuesta SIAT. `OFFLINE`: timeout/caída de red,
        trae XML firmado y `contingencyEventId` para envío posterior por paquete.
        Cada llamada crea una factura nueva. Para reintentos, use el ID de la factura existente y su CUF. Sector 30 → 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinimalInvoiceRequest"
            example:
              posId: 5226da47-74da-4b27-a26d-892c62fa6d26
              customer:
                documentType: ci
                documentNumber: "1234567"
                name: Ada Lovelace
                email: ada@example.com
              items:
                - sku: PLAN-PRO
                  description: Plan profesional
                  codigoActividad: "101010"
                  codigoProductoSin: 5113100
                  unidadMedida: 58
                  quantity: 1
                  price: 150
                  discount: 0
              invoiceType: sale
              sector: auto
              data: {}
      responses:
        "200":
          description: Factura emitida.
          headers:
            Location:
              schema:
                type: string
              description: /v1/invoices/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/SiatRejected"
        "503":
          $ref: "#/components/responses/SiatUnavailable"
  /v1/invoices/{id}:
    get:
      summary: Obtener factura por ID
      operationId: getInvoice
      tags:
        - invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: xml,company,pos,cufd,archivo,all (coma-separados).
      responses:
        "200":
          description: Factura del tenant autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/invoices/{id}/xml:
    get:
      summary: Descargar XML firmado
      operationId: downloadInvoiceXml
      tags:
        - invoices
      description: Solo facturas emitidas; pendiente → 409 CONFLICT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: XML firmado (attachment factura-{id}.xml).
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La factura aún no tiene XML disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    ValidationError:
      description: 400 VALIDATION_ERROR.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 401 UNAUTHORIZED (falta X-API-Key o key inválida).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 404 NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SiatRejected:
      description: 422 SIAT_REJECTED (details[] con observaciones del SIAT).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SiatUnavailable:
      description: 503 SIAT_UNAVAILABLE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: Supay API running
    MinimalInvoiceRequest:
      type: object
      additionalProperties: false
      required:
        - posId
        - customer
        - items
      properties:
        posId:
          type: string
          format: uuid
          description: Punto de venta con CUIS/CUFD vigente.
        customer:
          $ref: "#/components/schemas/MinimalInvoiceCustomer"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MinimalInvoiceItem"
        invoiceType:
          type: string
          default: sale
          description: sale|venta|compraventa|compra_venta (default sale). Notas requieren sector de ajuste (fuera de alcance).
        sector:
          type: string
          default: auto
          description: auto|sale|compraventa|1 para este flujo (auto resuelve a 1).
        data:
          type: object
          description: Campos datosSector del perfil ({} para sector 1).
        layout:
          type: string
          description: Solo sector 24 (fuera de alcance).
        referenceInvoiceId:
          type: string
          format: uuid
          description: Solo documentos de ajuste (fuera de alcance).
        payment:
          $ref: "#/components/schemas/MinimalInvoicePayment"
        total:
          type: number
          description: Solo sectores sin detalle (fuera de alcance).
    MinimalInvoiceCustomer:
      type: object
      additionalProperties: false
      required:
        - documentNumber
        - name
      properties:
        id:
          type: string
          description: NO permitido (400 si se envía); enviar snapshot completo.
        documentType:
          type: string
          default: CI
          description: ci|cédula|cex|extranjero|pasaporte|nit|otro (default CI).
        documentNumber:
          type: string
        complement:
          type: string
        name:
          type: string
        email:
          type: string
    MinimalInvoiceItem:
      type: object
      additionalProperties: false
      required:
        - sku
        - description
        - codigoProductoSin
        - unidadMedida
        - quantity
        - price
      properties:
        sku:
          type: string
          description: Código interno; se congela como snapshot fiscal (sin resolución por catálogo).
        description:
          type: string
        codigoActividad:
          type: string
          description: Opcional si la empresa tiene actividad principal (se hereda).
        codigoProductoSin:
          type: integer
          format: int64
          minimum: 1
        unidadMedida:
          type: integer
          minimum: 1
        quantity:
          type: number
          exclusiveMinimum: 0
        price:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
          description: No puede superar quantity*price.
        data:
          type: object
          description: Campos datos_sector_detalle (vacío para sector 1).
    MinimalInvoicePayment:
      type: object
      additionalProperties: false
      required:
        - methodCode
        - currencyCode
        - exchangeRate
      properties:
        methodCode:
          type: integer
          minimum: 1
        currencyCode:
          type: integer
          minimum: 1
        exchangeRate:
          type: number
          exclusiveMinimum: 0
    Invoice:
      type: object
      required:
      - id
      - companyId
      - customerId
      - posId
      - invoiceNumber
      - status
      - subtotal
      - discount
      - total
      - codigoMetodoPago
      - codigoMoneda
      - tipoCambio
      - codigoDocumentoSector
      - codigoTipoFactura
      - modalidad
      - emissionType
      - issueDate
      - customer
      - items
      - createdAt
      properties:
        id:
          type: string
        companyId:
          type: string
        customerId:
          type: string
        posId:
          type: string
        cufdId:
          type: string
        contingencyEventId:
          type: string
          nullable: true
        ajustaFacturaId:
          type: string
          nullable: true
        invoiceNumber:
          type: integer
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        cuf:
          type: string
          nullable: true
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        codigoMetodoPago:
          type: integer
        codigoMoneda:
          type: integer
        tipoCambio:
          type: number
        codigoDocumentoSector:
          type: integer
        codigoTipoFactura:
          type: integer
        layout:
          type: string
        modalidad:
          type: integer
        nombreEstudiante:
          type: string
          nullable: true
        periodoFacturado:
          type: string
          nullable: true
        sectorData:
          type: object
        emissionType:
          type: string
        issueDate:
          type: string
          format: date-time
        motivoAnulacion:
          type: integer
          nullable: true
        fechaAnulacion:
          type: string
          format: date-time
          nullable: true
        siatReceptionCode:
          type: string
          nullable: true
        siatMensajes:
          type: array
          items:
            $ref: '#/components/schemas/SiatMensaje'
        customer:
          $ref: '#/components/schemas/InvoiceCustomer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        createdAt:
          type: string
          format: date-time
        company:
          type: object
        pos:
          type: object
        cufdRecord:
          type: object
          nullable: true
        xml:
          type: string
          nullable: true
        xmlHash:
          type: string
          nullable: true
        archivo:
          type: string
        hashArchivo:
          type: string
    InvoiceStatus:
      type: string
      enum: [PENDING, ACCEPTED, OBSERVED, OFFLINE, REJECTED, ANNULLED]
    InvoiceCustomer:
      type: object
      required:
      - id
      - name
      - documentType
      - documentNumber
      properties:
        id:
          type: string
        name:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
        complement:
          type: string
          nullable: true
    InvoiceItem:
      type: object
      required:
      - id
      - code
      - description
      - quantity
      - unitPrice
      - discount
      - subtotal
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string
        codigoActividad:
          type: string
          nullable: true
        codigoProductoSin:
          type: string
          nullable: true
        unitCode:
          type: integer
          nullable: true
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
        subtotal:
          type: number
        sectorData:
          type: object
    SiatMensaje:
      type: object
      properties:
        codigo:
          type: integer
        descripcion:
          type: string
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, UNAUTHORIZED, FORBIDDEN, SIAT_REJECTED, SIAT_UNAVAILABLE, INTERNAL, RATE_LIMITED]
          description: Programar contra code, nunca contra message.
        message:
          type: string
        field:
          type: string
        sugerencias:
          type: array
          items:
            type: string
        accion:
          type: string
        invoiceId:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
