# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
instances:
  - url: supay.docs.buildwithfern.com
    custom-domain: docs.supay.dev

title: Supay

favicon: assets/supay.ico
css: ./style.css
default-language: typescript

# La raíz del sitio sirve la landing de Home
landing-page:
  page: Bienvenido
  path: ./docs/pages/home/index.mdx
  slug: /

# Logo institucional Supay ([imagen] Supay en el header vía right-text)
logo:
  dark: assets/icon-dark.png
  light: assets/icon-light.png
  right-text: Supay

colors:
  accent-primary:
    light: "#e11d48" # Tu rosa institucional (rose-600). Vibrante, estilo Stripe.
    dark: "#f43f5e"  # rose-500: Un tono ligeramente más saturado que el rose-400 para dar un efecto "glow" o neón sutil en dark mode (muy Vercel).
  background:
    light: "#ffffff" # Blanco puro absoluto.
    dark: "#000000"  # Negro puro. Vercel usa #000000 en lugar de grises oscuros para ese look infinito y profundo.
  border:
    light: "#eaeaea" # El clásico gris ultra sutil de Vercel.
    dark: "#333333"  # Un gris oscuro más "crujiente" que el #222 para separar secciones con limpieza sin requerir sombras.
  sidebar-background:
    light: "#fafafa" # Blanco roto sutil (Stripe) para dar jerarquía y profundidad sin usar sombras pesadas.
    dark: "#0a0a0a"  # Un negro levísimamente elevado (zinc-950) para separarlo del fondo puro #000000.
  header-background:
    light: "#ffffff" # Header limpio que se funde visualmente con el fondo.
    dark: "#000000"  # Continuidad absoluta en modo oscuro.
# Navbar: Tabs superiores, buscador centrado en la UX
layout:
  tabs-placement: header
  searchbar-placement: header
  content-alignment: center
  breadcrumbs:
    current-page: false

# CTAs del header: Acción secundaria (SDK) y primaria (Empezar)
navbar-links:
  - type: minimal
    text: SDK
    href: /sdk
  - type: filled
    text: Empezar
    href: /docs/empezar/quickstart

# Diseño Flat/Minimalista
theme:
  sidebar: minimal
  body: default
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble

# Tipografías propias (self-hosted, sin dependencias externas)
typography:
  headingsFont:
    name: Inter
    paths:
      - path: ./fonts/Inter-Variable.woff2
        weight: 400 700
        style: normal
  bodyFont:
    name: Inter
    paths:
      - path: ./fonts/Inter-Variable.woff2
        weight: 400 700
        style: normal
  codeFont:
    name: JetBrains Mono
    paths:
      - path: ./fonts/JetBrains-Mono-Variable.woff2
        weight: 400 500
        style: normal

# SEO / social previews
metadata:
  og:site_name: Supay Docs
  og:title: Supay · Facturación electrónica para Bolivia
  og:description: Emite facturas válidas ante el SIAT desde tu propio sistema, por API o con el SDK TypeScript. Sin integrar SOAP a mano.
  og:url: https://docs.supay.dev
  twitter:card: summary_large_image
  twitter:title: Supay · Facturación electrónica para Bolivia
  twitter:description: API + SDK TypeScript para facturación electrónica ante el SIAT de Bolivia.
  canonical-host: docs.supay.dev

# Buscador en español (motor incluido en Fern, nada que desplegar)
settings:
  search-text: "Buscar en la documentación de Supay..."
  dark-mode-code: true

# Redirects de páginas movidas/eliminadas al crear los tabs
redirects:
  - source: /referencia/sdk-type-script
    destination: /sdk

# Tabs superiores: Home · Docs · SDK · Licencia
tabs:
  home:
    display-name: Home
    icon: house
    slug: home
  docs:
    display-name: Docs
    icon: book
    slug: docs
  sdk:
    display-name: SDK
    icon: cube
    slug: sdk
  licencia:
    display-name: Licencia
    icon: scale-balanced
    slug: licencia

