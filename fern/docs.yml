# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
instances:
  - url: supay.docs.buildwithfern.com
    custom-domain: docs.supay.dev

title: Supay

favicon: assets/supay.ico

default-language: typescript

# Logo institucional Supay ([imagen] Supay en el header vía right-text)
logo:
  dark: assets/icon-dark.png
  light: assets/icon-light.png
  right-text: Supay

colors:
  accent-primary:
    light: "#e11d48" # Rosa institucional Supay (rose-600)
    dark: "#fb7185"  # Rose-400: contraste legible sobre fondo oscuro
  background:
    light: "#FFFFFF" # Fondo blanco estilo Vercel
    dark: "#0a0a0a"  # Fondo negro profundo estilo Vercel
  border:
    light: "#eaeaea" # Bordes sutiles claros
    dark: "#222222"  # Bordes oscuros discretos
  sidebar-background:
    light: "#fafafa"
    dark: "#0a0a0a"
  header-background:
    light: "#ffffff"
    dark: "#0a0a0a"

# Navbar: secciones como tabs en el header + buscador visible en el header
layout:
  tabs-placement: header
  searchbar-placement: header

# Estilo de tabs tipo píldora en el header
theme:
  tabs:
    style: bubble
    alignment: left
    placement: header

# Buscador en español (motor incluido en Fern, nada que desplegar)
settings:
  search-text: "Buscar en la documentación de Supay..."

navigation:
  - section: Información general
    path: ./docs/pages/general/que-es-supay.mdx
    contents:
      - page: Modelo de datos
        path: ./docs/pages/general/modelo.mdx
      - page: Glosario SIAT
        path: ./docs/pages/general/glosario.mdx
  - section: Empezar
    contents:
      - page: Quickstart (5 min)
        path: ./docs/pages/empezar/quickstart.mdx
      - page: Autenticación
        path: ./docs/pages/empezar/autenticacion.mdx
      - page: Onboarding del tenant
        path: ./docs/pages/empezar/onboarding.mdx
  - section: Facturación
