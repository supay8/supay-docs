    CreateApiKeyRequest:
      type: object
      properties:
        name: { type: string, default: default }
    CreateApiKeyResponse:
      type: object
      properties:
        apiKey: { type: string, description: Solo se muestra una vez. Enviar como X-API-Key. }
        keyPrefix: { type: string }
        id: { type: string }
        name: { type: string }
        createdAt: { type: string }
    ApiKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              keyPrefix: { type: string }
              name: { type: string }
              isActive: { type: boolean }
              lastUsedAt: { type: string }
              createdAt: { type: string }
    Certificate:
      type: object
      properties:
        id: { type: string }
        companyId: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
        notBefore: { type: string }
        notAfter: { type: string }
        p12StorageRef: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    CertificateList:
      type: object
