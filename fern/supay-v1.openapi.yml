      properties:
        posId: { type: string, description: Punto de venta con CUIS/CUFD vigente. }
        customer: { $ref: "#/components/schemas/MinimalInvoiceCustomer" }
        items:
          type: array
          items: { $ref: "#/components/schemas/MinimalInvoiceItem" }
        invoiceType: { type: string, default: sale }
