# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: supay-v1.openapi.yml
default-group: local
groups:
  local:
    generators:
      - name: fern-typescript-sdk
        version: 3.96.0
        output:
          location: local-file-system
          path: ./sdks/typescript
        config:
          namespaceExport: SupayApi
          naming:
            namespace: SupayApi
            client: Supay
            error: SupayError
            timeoutError: SupayTimeoutError
            environment: SupayEnvironment
      
